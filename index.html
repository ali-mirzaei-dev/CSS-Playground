<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Playground</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.7;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 15px 0;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #1c1c26;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        a:hover {
            background: #2a2a3a;
            scale: 1.05;
        }
    </style>
</head>

<body>
    <h1>🎨 CSS Playground</h1>
    <p>My collection of CSS tricks and UI experiments</p>

    <h2>My Tricks</h2>

    <ul>
        <li><a href="./Apple-Keyboard/">⌨️ Apple Keyboard</a></li>
        <li><a href="./audio-fx/">🔥 Audio FX</a></li>
    </ul>
</body>

</html>
